<!DOCTYPE html>
<!--
  AppVision REST sample: log in, follow live notifications, read and write a variable.
  All the REST calls are in appServer.js; this page only handles the form and the display.
  Serve these files from the AppVision web server (AppVision 4\Bin\Web\WebServiceREST\), see README.md.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AppVision REST sample</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; margin: 16px; color: #222; }
        fieldset { border: 1px solid #ccc; margin-bottom: 12px; }
        label { display: inline-block; min-width: 70px; }
        input { margin: 2px 8px 2px 0; }
        #status { font-weight: 600; margin: 8px 0; }
        #status.error { color: #b00020; }
        #log { font-family: Consolas, monospace; font-size: 13px; border: 1px solid #ddd; height: 360px; overflow-y: auto; padding: 4px; }
        #log div { white-space: pre; }
        .alarm { color: #b00020; }
        .event { color: #1a5fb4; }
        [hidden] { display: none !important; }
    </style>
    <script src="appServer.js"></script>
</head>
<body>
    <h2>AppVision REST sample</h2>

    <form id="loginForm">
        <fieldset>
            <legend>Connection</legend>
            <label for="host">Server</label><input id="host" size="30" required />
            <label for="user">User</label><input id="user" value="ADM" size="10" required autocomplete="username" />
            <label for="pwd">Password</label><input id="pwd" type="password" size="10" autocomplete="current-password" />
            <button type="submit">Log in</button>
        </fieldset>
    </form>

    <div id="session" hidden>
        <fieldset>
            <legend>Variable</legend>
            <label for="varName">Name</label><input id="varName" size="30" placeholder="Building.Room1.Temperature" />
            <label for="varValue">Value</label><input id="varValue" size="10" />
            <button id="read">Read</button>
            <button id="write">Write</button>
        </fieldset>
        <button id="logout">Log out</button>
    </div>

    <div id="status"></div>
    <div id="log"></div>

    <script>
        const $ = id => document.getElementById(id);
        let srv = null;

        // default server: the one serving this page, when it is served over http(s)
        $('host').value = location.protocol.startsWith('http') ? location.origin : 'http://localhost';

        function setStatus(text, isError) {
            $('status').textContent = text;
            $('status').className = isError ? 'error' : '';
        }

        // newest line on top, text only (server data is never interpreted as HTML), 200 lines max
        function addLine(text, cssClass) {
            const line = document.createElement('div');
            line.textContent = new Date().toLocaleTimeString() + '  ' + text;
            if (cssClass)
                line.className = cssClass;
            $('log').prepend(line);
            while ($('log').childElementCount > 200)
                $('log').lastElementChild.remove();
        }

        function showNotification(n) {
            switch (n?.__type) {
                case 'VariableState:#Prysm.AppVision.Data':
                    addLine(`${n.Name} = ${n.Value}`);
                    break;
                case 'AlarmInfo:#Prysm.AppVision.Data':
                    addLine(`Alarm ${AppServer.AlarmEvents[n.Event] ?? n.Event}: ${n.Alarm?.Description} (severity ${n.Alarm?.Severity})`, 'alarm');
                    break;
                case 'EventRow:#Prysm.AppVision.Data':
                    addLine(`Event ${n.StateDesc}: ${n.Description}`, 'event');
                    break;
                // other types: ServerState, AreaState, GroupState, ProtocolState, ScenarioState, UserState...
            }
        }

        $('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            setStatus('Connecting...');
            srv = new AppServer($('host').value);
            srv.onNotification = showNotification;
            srv.onDisconnected = err => {
                setStatus('Disconnected: ' + err.message, true);
                $('session').hidden = true;
                $('loginForm').hidden = false;
            };
            try {
                await srv.login($('user').value, $('pwd').value);
                $('pwd').value = '';
                $('loginForm').hidden = true;
                $('session').hidden = false;
                const u = srv.user;
                setStatus(`${u.FirstName ?? ''} ${u.LastName || u.Name} connected to "${srv.projectName}" at ${srv.host}`);
            } catch (err) {
                setStatus(err.message, true);
            }
        });

        $('read').addEventListener('click', async () => {
            try {
                const s = await srv.get('GetVariableStateByName?name=' + encodeURIComponent($('varName').value));
                if (!s)
                    throw new Error('Unknown variable ' + $('varName').value);
                $('varValue').value = s.Value;
                addLine(`Read ${s.Name} = ${s.Value} (quality ${s.Quality}, severity ${s.Severity})`);
            } catch (err) {
                setStatus(err.message, true);
            }
        });

        $('write').addEventListener('click', async () => {
            try {
                await srv.post('SetVariableExt', [
                    { Name: '@name', Value: $('varName').value },
                    { Name: '@value', Value: $('varValue').value }
                ]);
            } catch (err) {
                setStatus(err.message, true);
            }
        });

        $('logout').addEventListener('click', async () => {
            await srv.logout();
            $('session').hidden = true;
            $('loginForm').hidden = false;
            setStatus('Logged out');
        });

        // close the session when the page is closed or reloaded
        window.addEventListener('pagehide', () => {
            if (srv?.sessionId)
                fetch(srv.url('Close'), { headers: { 'SessionID': srv.sessionId }, keepalive: true });
        });
    </script>
</body>
</html>
