<!DOCTYPE html>
<!--
  AppVision WebService REST demo – Login page
  ============================================
  Presents a simple form that collects the AppVision server URL, login name
  and password, then forwards them as URL query-string parameters to main.html
  (e.g. main.html?host=http://localhost&user=ADM&pwd=123).

  No JavaScript is used on this page: the standard HTML <form> action and
  GET method handle the redirect automatically.

  Default credentials (change for production use):
    Host: http://localhost
    User: ADM
    Password: 123
-->
<html>
<head>
    <title>AppVision WebService demo</title>
    <meta charset="utf-8" />
</head>
<body>
    <h2>AppVision WebService demo</h2>
    <form action="main.html">
        <label>Hostname</label><input type="text" name="host" value="http://localhost" /><br>
        <label>Username</label><input type="text" name="user" value="ADM" /><br>
        <label>Password</label><input type="password" name="pwd" value="123" /><br>
        <input type="submit" value="Login" />
    </form>
</body>
</html>
