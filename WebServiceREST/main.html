<!DOCTYPE html>
<!--
  AppVision WebService REST demo – Main page
  ===========================================
  Reads the server credentials from the URL query string (set by login.html),
  instantiates AppServer (appServer.js) and opens the AppVision session.

  Once connected:
  - #conn  shows "<LastName> connected to <ProjectDescription> at <host>".
  - #log   receives a live stream of alarms, events and variable changes
           appended by AppServer.gotEvent() via the keepAlive polling loop.
-->
<html>
<head>
    <title>AppVision WebService demo</title>
    <meta charset="utf-8" />
    <script src="appServer.js"></script>
</head>
<body>
    <h2>AppVision WebService demo</h2>
	<p id="conn"/>
	<p id="log"/>

    <script>
        /*
         * Read the three credential parameters forwarded by login.html via
         * the URL query string, then open the AppVision session.
         *
         * On success: the #conn paragraph shows the connected user and project.
         * On failure: document.writeln() prints the error returned by AppServer.
         */
        let params = new URLSearchParams(window.location.search);
        let host = params.get('host');  // AppVision server base URL
        let user = params.get('user');  // login name
        let pwd  = params.get('pwd');   // password

        if (host && user) {

            var appServer = new AppServer();

            appServer.login(host, user, pwd)
                // display connection banner once login resolves
                .then(() => document.getElementById('conn').innerText = `${appServer.user.LastName} connected to ${appServer.desc} at ${host}`)
                .catch(err => document.writeln(err));
        }

    </script>
</body>
</html>
