# Publishes this repository on GitHub (https://github.com/Prysm-Software/AppVision-SDKSamples) after each change of master
# and each tag. Azure DevOps stays the reference: work through pull requests here, never commit on GitHub directly
# (the push below is not forced and fails if GitHub has commits that Azure DevOps does not have).
#
# Setup (once):
#   1. GitHub: a fine-grained personal access token (or a GitHub App token) for the Prysm-Software organization,
#      repository AppVision-SDKSamples only, permission "Contents: Read and write".
#   2. Azure DevOps: create the pipeline from this file, and add the secret variable GITHUB_MIRROR_TOKEN with that token.

trigger:
  branches:
    include:
      - master
  tags:
    include:
      - '*'

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: true

  - bash: |
      set -euo pipefail
      remote="https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/Prysm-Software/AppVision-SDKSamples.git"
      if [[ "$(Build.SourceBranch)" == refs/tags/* ]]; then
        git push "$remote" "$(Build.SourceBranch):$(Build.SourceBranch)"
      else
        git push "$remote" "HEAD:refs/heads/master"
      fi
    displayName: Push to GitHub
    env:
      GITHUB_MIRROR_TOKEN: $(GITHUB_MIRROR_TOKEN)
